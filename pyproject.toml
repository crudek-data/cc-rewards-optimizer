[project]
name = "cc-rewards-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carter", email = "crudek.data@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "streamlit>=1.66.1",
]

[project.scripts]
cc-rewards-optimizer = "cc_rewards_optimizer:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
